<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082A1F">
<title>Zero to Hero – සම්බන්ධතාවය නැත</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:#0F3D2E;color:#fff;font-family:"Noto Sans Sinhala",system-ui,sans-serif;line-height:1.7;text-align:center;padding:24px;box-sizing:border-box}
  img{width:64px;height:64px;border-radius:22%}
  h1{color:#F2D47A;font-size:1.4rem;margin:16px 0 8px}
  p{max-width:26rem;margin:0 auto;color:rgba(255,255,255,.85)}
  button{margin-top:20px;min-height:52px;padding:0 24px;border:0;border-radius:12px;background:#D4A62A;color:#082A1F;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
</style>
</head>
<body>
  <main>
    <img src="/brand/logo.svg" alt="Zero to Hero">
    <h1>අන්තර්ජාල සම්බන්ධතාවය නැත</h1>
    <p>විභාගයට සහභාගී වීමට අන්තර්ජාල සම්බන්ධතාවයක් අවශ්‍යයි. ඔබගේ සුරැකි පිළිතුරු නැති නොවේ, නමුත් විභාග කාලය නොනැවතී ගණනය වේ. සම්බන්ධ වූ විගස නැවත උත්සාහ කරන්න.</p>
    <button onclick="location.reload()">නැවත උත්සාහ කරන්න</button>
  </main>
</body>
</html>
