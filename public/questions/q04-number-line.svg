<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 112" role="img" aria-label="−4 සිට 5 දක්වා සංඛ්‍යා රේඛාව; −3 හි පිරවූ තිතක්, 4 හි හිස් රවුමක්">
  <rect width="560" height="112" fill="#ffffff"/>
  <g font-family="'Noto Sans Sinhala', Arial, sans-serif" font-size="24" fill="#14231C" text-anchor="middle">
    <!-- axis -->
    <line x1="20" y1="50" x2="532" y2="50" stroke="#14231C" stroke-width="2.5"/>
    <path d="M544 50 L528 42 L528 58 Z" fill="#14231C"/>
    <!-- marked range -->
    <line x1="95" y1="50" x2="445" y2="50" stroke="#0F3D2E" stroke-width="6" stroke-linecap="butt"/>
    <!-- ticks and labels: -4 … 5, 50 px apart, -4 at x=45 -->
    <g stroke="#14231C" stroke-width="2.5">
      <line x1="45" y1="40" x2="45" y2="60"/><line x1="95" y1="40" x2="95" y2="60"/>
      <line x1="145" y1="40" x2="145" y2="60"/><line x1="195" y1="40" x2="195" y2="60"/>
      <line x1="245" y1="40" x2="245" y2="60"/><line x1="295" y1="40" x2="295" y2="60"/>
      <line x1="345" y1="40" x2="345" y2="60"/><line x1="395" y1="40" x2="395" y2="60"/>
      <line x1="445" y1="40" x2="445" y2="60"/><line x1="495" y1="40" x2="495" y2="60"/>
    </g>
    <text x="45" y="94">−4</text><text x="95" y="94">−3</text><text x="145" y="94">−2</text>
    <text x="195" y="94">−1</text><text x="245" y="94">0</text><text x="295" y="94">1</text>
    <text x="345" y="94">2</text><text x="395" y="94">3</text><text x="445" y="94">4</text>
    <text x="495" y="94">5</text>
  </g>
  <!-- endpoints: filled at -3 (included), open at 4 (not included) -->
  <circle cx="95" cy="50" r="9" fill="#0F3D2E" stroke="#0F3D2E" stroke-width="2.5"/>
  <circle cx="445" cy="50" r="9" fill="#ffffff" stroke="#0F3D2E" stroke-width="3"/>
</svg>
